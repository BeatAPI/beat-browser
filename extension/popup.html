<!doctype html>
<meta charset="utf-8" />
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d12;
    --panel: #12141a;
    --ink: #f4efe7;
    --muted: #8a8580;
    --line: #2a2e38;
    --ok: #3d9a6a;
    --track: #2a2e38;
    --thumb: #f4efe7;
  }
  * { box-sizing: border-box; }
  body {
    width: 280px;
    margin: 0;
    padding: 14px;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .top {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo {
    width: 28px; height: 28px; border-radius: 8px;
    border: 1px solid var(--line); background: #161922; flex: none;
    object-fit: contain; padding: 3px;
  }
  .name { font-weight: 600; font-size: 13.5px; }
  .name span { color: var(--muted); font-weight: 400; font-size: 11px; margin-left: 4px; }
  .status {
    margin-top: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
  }
  .status-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #5c616b; flex: none;
  }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(61,154,106,.18); }
  .label { font-size: 12.5px; font-weight: 500; }
  .meta {
    margin-top: 6px;
    padding: 0 2px;
    font-size: 11px;
    color: var(--muted);
  }
  .action {
    margin-top: 10px;
    width: 100%;
    padding: 9px;
    border: 0;
    border-radius: 10px;
    background: var(--ink);
    color: var(--bg);
    font: inherit;
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
  }
  .action:disabled { opacity: .35; cursor: default; }
  .action[hidden] { display: none; }

  details.adv {
    margin-top: 12px;
    border-top: 1px solid var(--line);
    padding-top: 10px;
  }
  details.adv > summary {
    list-style: none;
    cursor: pointer;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    user-select: none;
  }
  details.adv > summary::-webkit-details-marker { display: none; }
  details.adv > summary::after { content: " +"; }
  details.adv[open] > summary::after { content: " –"; }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 10px;
  }
  .toggle-copy .t { font-size: 12.5px; font-weight: 500; }
  .toggle-copy .d { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* switch — different affordance than upstream Enable/Disable bricks */
  .sw {
    position: relative;
    width: 40px; height: 24px;
    border-radius: 999px;
    background: var(--track);
    border: 1px solid var(--line);
    cursor: pointer;
    flex: none;
    padding: 0;
  }
  .sw.on { background: rgba(61,154,106,.35); border-color: rgba(61,154,106,.55); }
  .sw i {
    position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--thumb);
    transition: left 140ms ease;
  }
  .sw.on i { left: 18px; }

  .sess { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .sess .s { display: flex; align-items: center; gap: 7px; font-size: 11.5px; }
  .sess .swatch { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .sess .who { font-weight: 600; }
  .sess .page { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .foot {
    margin-top: 12px;
    font-size: 11px;
    color: var(--muted);
  }
  code {
    font-size: 10.5px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0 4px;
  }
</style>

<div class="top">
  <img class="logo" src="icons/logo-light.png" width="28" height="28" alt="" />
  <div class="name">BeatBrowser <span id="ver"></span></div>
</div>

<div class="status">
  <div class="status-left">
    <span class="dot" id="dot"></span>
    <span class="label" id="state">Checking…</span>
  </div>
</div>
<div class="meta" id="conntip" hidden></div>
<button class="action" id="btn" type="button" hidden>Reconnect</button>

<details class="adv">
  <summary>Advanced</summary>

  <div class="toggle-row">
    <div class="toggle-copy">
      <div class="t" id="l2state">High-fidelity input</div>
      <div class="d">Trusted events for picky sites</div>
    </div>
    <button class="sw" id="l2btn" type="button" aria-pressed="false" title="Toggle high-fidelity"><i></i></button>
  </div>
  <span id="l2dot" class="dot" hidden></span>

  <div class="toggle-row">
    <div class="toggle-copy">
      <div class="t" id="markstate">Show control marks</div>
      <div class="d">Border + badge on agent tabs</div>
    </div>
    <button class="sw" id="markbtn" type="button" aria-pressed="false" title="Toggle control marks"><i></i></button>
  </div>
  <span id="markdot" class="dot" hidden></span>
  <div class="sess" id="sess"></div>
</details>

<div class="foot" id="tip">Stuck? <code>beat-browser doctor</code></div>

<script src="popup.js"></script>
